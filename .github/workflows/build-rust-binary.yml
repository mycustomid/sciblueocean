name: Build & Package Rust ERP Binary (Offloaded Compute)

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend-rust/**'
      - '.github/workflows/build-rust-binary.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-linux-binary:
    name: Build Production Rust Binary (x86_64 Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust

      - name: Build Release Binary
        run: |
          cargo build --release --locked || cargo build --release
        working-directory: backend-rust

      - name: Verify Binary
        run: |
          ls -la backend-rust/target/release/blue-line-erp-api
          file backend-rust/target/release/blue-line-erp-api

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blue-line-erp-api-linux-x86_64
          path: backend-rust/target/release/blue-line-erp-api
          retention-days: 7
