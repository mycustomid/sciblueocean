name: RC10 Controlled Returns Release Gate
on:
  pull_request:
    paths:
      - 'backend-rust/**'
      - 'public/rc10/**'
      - 'tests/rc10-contract.test.mjs'
      - '.github/workflows/rc10-returns-check.yml'
  push:
    paths:
      - 'backend-rust/**'
      - 'public/rc10/**'
      - 'tests/rc10-contract.test.mjs'
      - '.github/workflows/rc10-returns-check.yml'
permissions:
  contents: read
jobs:
  node-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --check public/rc10/pilot.js
      - run: node --test tests/*.test.mjs
  rust-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: rc10_ci_disposable_only
          POSTGRES_DB: blueline_rc10
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d blueline_rc10'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:rc10_ci_disposable_only@localhost:5432/blueline_rc10
    defaults:
      run:
        working-directory: backend-rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Compile all targets
        run: cargo +stable check --all-targets
      - name: Run Rust unit + PostgreSQL integration tests
        run: cargo +stable test --all-targets
      - name: Run Clippy (advisory until existing warnings addressed)
        run: cargo +stable clippy --all-targets
