name: RC11 Rust and PostgreSQL Release Gate
on:
  pull_request:
    paths:
      - 'backend-rust/**'
      - 'tests/**'
      - '.github/workflows/rc11-rust-postgres-gate.yml'
  push:
    paths:
      - 'backend-rust/**'
      - 'tests/**'
      - '.github/workflows/rc11-rust-postgres-gate.yml'
permissions:
  contents: read
jobs:
  rust-pg-required:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: rc11_only_disposable
          POSTGRES_DB: blueline_rc11
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:rc11_only_disposable@127.0.0.1:5432/blueline_rc11
      DATABASE_URL: postgres://postgres:rc11_only_disposable@127.0.0.1:5432/blueline_rc11
      ERP_ENV: ci
      ERP_AUTO_MIGRATE: 'false'
    defaults:
      run:
        working-directory: backend-rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Report Rust versions
        run: rustc --version && cargo --version
      - name: Compile everything (mandatory)
        run: cargo check --all-targets
      - name: Run ALL Rust and PostgreSQL tests (mandatory, not advisory)
        run: cargo test --all-targets -- --nocapture
      - name: Confirm RC11 migration version
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          files=sorted(Path('migrations').glob('*.sql'))
          assert [x.name[:4] for x in files] == [f'{i:04d}' for i in range(1,13)], files
          print('Migration chain RC6-RC11 complete:',len(files))
          PYTHON
  javascript-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test tests/*.test.mjs
