name: RC15 Enterprise Rust PostgreSQL Hard Gate
on:
  pull_request:
    paths:
      - 'backend-rust/**'
      - 'tests/**'
      - '.github/workflows/rc15-enterprise-domains-gate.yml'
  push:
    paths:
      - 'backend-rust/**'
      - 'tests/**'
      - '.github/workflows/rc15-enterprise-domains-gate.yml'
permissions:
  contents: read
jobs:
  rust-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: rc15_disposable_testing_only
          POSTGRES_DB: rc15_test_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:rc15_disposable_testing_only@127.0.0.1:5432/rc15_test_disposable
      DATABASE_URL: postgres://postgres:rc15_disposable_testing_only@127.0.0.1:5432/rc15_test_disposable
      ERP_ENV: ci
      ERP_AUTO_MIGRATE: 'false'
    defaults:
      run:
        working-directory: backend-rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Rust toolchain
        run: cargo --version && rustc --version
      - name: Compile all binaries and integration tests
        run: cargo check --all-targets
      - name: Execute Rust test suite against disposable PG 16
        run: cargo test --all-targets -- --nocapture
      - name: Verify migrations 0001 through 0012
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          xs=sorted(p.name[:4] for p in Path('migrations').glob('*.sql'))
          assert xs == [f'{i:04d}' for i in range(1,13)],xs
          print('Migration chain complete:',len(xs))
          PYTHON
  node-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test tests/*.test.mjs
      - run: |
          for v in 13 14 15; do node --check "public/rc$v/pilot.js"; done
