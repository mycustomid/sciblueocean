name: RC17 Rust HR Security PostgreSQL Release Gate
on:
  pull_request:
    paths:
      - 'backend-rust/**'
      - 'tests/**'
      - 'public/rc16/**'
      - 'public/rc17/**'
      - '.github/workflows/rc17-rust-hr-security-gate.yml'
  push:
    paths:
      - 'backend-rust/**'
      - 'tests/**'
      - 'public/rc16/**'
      - 'public/rc17/**'
      - '.github/workflows/rc17-rust-hr-security-gate.yml'
permissions:
  contents: read
jobs:
  rust-postgres-required:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: rc17_disposable_ci_only
          POSTGRES_DB: rc17_test_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U postgres -d rc17_test_disposable'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:rc17_disposable_ci_only@127.0.0.1:5432/rc17_test_disposable
      DATABASE_URL: postgres://postgres:rc17_disposable_ci_only@127.0.0.1:5432/rc17_test_disposable
      ERP_AUTO_MIGRATE: 'false'
      ERP_ENV: ci
    defaults:
      run:
        working-directory: backend-rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Rust toolchain inventory
        run: cargo --version && rustc --version
      - name: Fail-closed Rust compilation
        run: cargo check --all-targets
      - name: Rust unit tests and live PostgreSQL integration tests
        run: cargo test --all-targets -- --nocapture
      - name: Migrations must include 0001 through 0012
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          names=sorted(p.name[:4] for p in Path('migrations').glob('*.sql'))
          assert names == [f'{i:04d}' for i in range(1,13)], names
          print('RC17 migration chain present:',len(names))
          PYTHON
  node-contracts-required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test tests/*.test.mjs
      - run: node --check public/rc16/pilot.js && node --check public/rc17/pilot.js
