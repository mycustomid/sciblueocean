version: '3.8'

services:
  blueline-db:
    image: postgres:16-alpine
    container_name: blueline-erp-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: blue_line_secure_pwd_2026
      POSTGRES_DB: blueline_erp
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - coolify

networks:
  coolify:
    external: true
